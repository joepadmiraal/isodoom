# CI: lint this workflow (actionlint + shellcheck), build + test the .NET
# solution, then export the Godot project for Linux x86_64, Windows x86_64
# and macOS (universal) headlessly (all from Linux), run the WAD viewer check (T1.6b) and the level
# check (T2.6) against a generated synthetic IWAD (tools/SyntheticIwad: no id
# data, no download) in the editor and in the exported Linux build, upload
# the builds, and smoke-test and check the Windows build on a Windows runner
# (T8.4) and the macOS build on macOS runners, Apple Silicon and Intel (T8.4a),
# and on a pushed tag v* stamp its version into the builds and publish them
# as a GitHub release. Toolchain versions are
# pinned in SPEC §12 (keep GODOT_VERSION in sync with .devcontainer/ and
# IsoDoom.csproj; the .NET SDK comes from global.json). The actions' versions
# are bumped by Dependabot (.github/dependabot.yml). CONTRIBUTING.md lists
# the local command for each check: keep it in sync with the steps here.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash  # bash -eo pipefail

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # Q6: lint this workflow with the dev container's actionlint, which also runs
  # shellcheck on the run: scripts (preinstalled on ubuntu-24.04; the step
  # below fails if it is missing, since actionlint would silently skip it).
  # The version and SHA-256 are read from .devcontainer/Dockerfile's ARGs, so
  # they live in one place.
  actionlint:
    name: Lint workflows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          set -eux
          version="$(sed -n 's/^ARG ACTIONLINT_VERSION=//p' .devcontainer/Dockerfile)"
          sha256="$(sed -n 's/^ARG ACTIONLINT_SHA256=//p' .devcontainer/Dockerfile)"
          test -n "$version"
          test -n "$sha256"
          name="actionlint_${version}_linux_amd64.tar.gz"
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          curl -fsSL --retry 3 -o "$dir/$name" \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/${name}"
          echo "${sha256}  $dir/$name" | sha256sum -c -
          tar -xzf "$dir/$name" -C "$dir" actionlint
          echo "$dir" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          actionlint -version
          shellcheck --version

      - name: actionlint
        run: actionlint

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore IsoDoom.sln

      # .editorconfig's formatting and the style rules at warning (Q3);
      # `dotnet format IsoDoom.sln` fixes what this reports.
      - name: Check formatting
        run: dotnet format IsoDoom.sln --verify-no-changes --no-restore --severity warn

      - name: Build
        run: dotnet build IsoDoom.sln --no-restore --configuration Debug

      # DOOM1.WAD is not in the repo, so WAD tests report as skipped here.
      - name: Test
        run: dotnet test --no-build --configuration Debug

  export:
    name: Export Linux, Windows and macOS
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-export-${{ runner.os }}-${{ hashFiles('global.json', '**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-export-${{ runner.os }}-

      # Editor + Linux and Windows x86_64 and macOS export templates for the
      # pinned Godot .NET build.
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}.mono
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-mono-linux-windows-x86_64-macos

      - name: Download Godot and export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -eux
          tag="${GODOT_VERSION}-${GODOT_RELEASE}"
          base="https://github.com/godotengine/godot/releases/download/${tag}"
          name="Godot_v${tag}_mono_linux_x86_64"
          tpz="Godot_v${tag}_mono_export_templates.tpz"
          tmp="$(mktemp -d)"
          cd "$tmp"
          for f in "${name}.zip" "$tpz" SHA512-SUMS.txt; do
            curl -fsSL --retry 3 -o "$f" "$base/$f"
          done
          grep -F -e "  ${name}.zip" -e "  ${tpz}" SHA512-SUMS.txt > sums.txt
          test "$(wc -l < sums.txt)" -eq 2
          sha512sum -c sums.txt
          unzip -q "${name}.zip"
          rm -rf ~/godot
          mv "${name}" ~/godot
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}.mono
          mkdir -p "$dest"
          # Keep only what the Linux, Windows x86_64 and macOS exports need
          # (the full set is ~1.2 GB). The Windows preset always exports the
          # console wrapper, through which the Windows job reads the game's
          # output. macos.zip holds the universal .app template.
          unzip -q "$tpz" -d templates
          for f in version.txt linux_release.x86_64 linux_debug.x86_64 \
              windows_release_x86_64.exe windows_release_x86_64_console.exe \
              windows_debug_x86_64.exe windows_debug_x86_64_console.exe \
              macos.zip; do
            mv "templates/templates/$f" "$dest/"
          done
          cd /
          rm -rf "$tmp"

      - name: Put godot on PATH
        run: |
          mkdir -p ~/.local/bin
          ln -sf ~/godot/"Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_mono_linux.x86_64" ~/.local/bin/godot
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Godot version
        run: godot --headless --version

      # On a release tag (v*), the tag's version goes into the project and the
      # Windows and macOS metadata before anything runs (tools/stamp-version.sh;
      # the game prints it at start). Other builds stay "dev".
      - name: Stamp the version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: tools/stamp-version.sh "$TAG"

      # A fresh checkout has no .godot/ cache: import first so the export sees
      # every resource, then export (Godot runs `dotnet publish` itself).
      - name: Import
        run: godot --headless --import

      # The import doesn't compile the C# project: the editor runs below need
      # its assembly in .godot/mono/temp/bin/Debug, or no script class loads
      # (Main.cs "could not be found") and the run hangs until its timeout.
      - name: Build the Godot project's assembly
        run: dotnet build IsoDoom.csproj --configuration Debug

      # The viewer check needs an IWAD; DOOM1.WAD can't be in the repo, so
      # generate one (outside the checkout, never uploaded).
      - name: Generate the synthetic IWAD
        run: |
          iwad="$RUNNER_TEMP/isodoom-synthetic.wad"
          dotnet run --project tools/SyntheticIwad --configuration Debug -- "$iwad"
          echo "ISODOOM_CI_IWAD=$iwad" >> "$GITHUB_ENV"

      # Editor run, headless (dummy renderer): every graphic view and every
      # lump-list row, checking the RG8 uploads. Exits 1 on a failure.
      - name: Viewer check (editor, headless)
        run: |
          timeout 300 godot --headless -- --viewer-check -iwad "$ISODOOM_CI_IWAD" 2>&1 | tee viewer-check-editor.log
          grep -q "WAD viewer check: OK" viewer-check-editor.log

      # The level check (T2.6), editor, headless: every map of the IWAD built
      # in the level scene; meshes, texture binding and per-sector data
      # checked against the levels. Exits 1 on a failure.
      - name: Level check (editor, headless)
        run: |
          timeout 300 godot --headless -- --level-check -iwad "$ISODOOM_CI_IWAD" 2>&1 | tee level-check-editor.log
          grep -q "Level check: OK" level-check-editor.log

      # T5.10: the synthetic routes played in the level scene (the script's
      # `route`): E1M1's exit into E1M2 (T7.1: through the intermission,
      # `skip`), then E1M2's secret exit, whose next map the synthetic IWAD
      # lacks: back to the title loop. `map NAME EXITS` fails the script
      # unless the scene shows NAME after EXITS exits.
      - name: Route play (editor, headless)
        run: |
          r=tests/IsoDoom.Tests/Sim/Routes
          timeout 300 godot --headless --fixed-fps 35 -- -iwad "$ISODOOM_CI_IWAD" --level E1M1 \
            --level-tweaks=vanilla --level-monsters=off \
            --level-script="route $r/synthetic-exit.route; gamestate intermission; skip; map E1M2 1; route $r/synthetic-secret-exit.route; map E1M2 2; skip; gamestate demoscreen"

      - name: Export
        run: |
          mkdir -p export/linux
          godot --headless --export-release "Linux" export/linux/IsoDoom.x86_64
          test -x export/linux/IsoDoom.x86_64
          ls -la export/linux

      - name: Smoke-test the exported build
        run: |
          timeout 120 export/linux/IsoDoom.x86_64 --headless --quit-after 60 2>&1 | tee smoke.log
          grep -q "IsoDoom started" smoke.log

      # The exported build with a real renderer: Xvfb plus Mesa's software
      # Vulkan driver (lavapipe), so the check also reads every drawn pixel
      # back and compares it with the CPU palette conversion.
      - name: Install Xvfb and lavapipe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth mesa-vulkan-drivers libvulkan1

      - name: Viewer check (exported build, software Vulkan)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" \
            export/linux/IsoDoom.x86_64 --audio-driver Dummy -- --viewer-check -iwad "$ISODOOM_CI_IWAD" 2>&1 | tee viewer-check-export.log
          grep -q "drawn pixels compared" viewer-check-export.log
          grep -q "WAD viewer check: OK" viewer-check-export.log

      # The level check in the exported build with a real renderer: also
      # renders the synthetic E1M1 top-down and side-on at every wall, moves a
      # floor through the data texture, and compares drawn pixels with the
      # CPU texel lookup and palette conversion.
      - name: Level check (exported build, software Vulkan)
        env:
          VK_DRIVER_FILES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: |
          timeout 600 xvfb-run -a -s "-screen 0 1280x720x24" \
            export/linux/IsoDoom.x86_64 --audio-driver Dummy -- --level-check -iwad "$ISODOOM_CI_IWAD" 2>&1 | tee level-check-export.log
          grep -q "drawn pixels compared" level-check-export.log
          grep -q "Level check: OK" level-check-export.log

      - uses: actions/upload-artifact@v7
        with:
          name: IsoDoom-linux-x86_64
          path: export/linux/
          if-no-files-found: error
          retention-days: 14

      # T8.4: the Windows build, exported here (Godot cross-exports it, and
      # `dotnet publish` takes the win-x64 runtime from NuGet; the exe's icon
      # and version info are edited by Godot itself, no rcedit or Wine) and
      # tested on a Windows runner by test-windows below.
      - name: Export Windows
        run: |
          mkdir -p export/windows
          godot --headless --export-release "Windows" export/windows/IsoDoom.exe
          test -f export/windows/IsoDoom.exe
          test -f export/windows/IsoDoom.console.exe
          test -f export/windows/data_IsoDoom_windows_x86_64/IsoDoom.dll
          ls -la export/windows

      - uses: actions/upload-artifact@v7
        with:
          name: IsoDoom-windows-x86_64
          path: export/windows/
          if-no-files-found: error
          retention-days: 14

      # T8.4a: the macOS build, exported here too (universal: arm64 and
      # x86_64 in one executable, with a .NET runtime folder per
      # architecture; `dotnet publish` takes both osx runtimes from NuGet).
      # Godot's built-in signing signs it ad hoc (no Apple identity, not
      # notarized: Apple Silicon runs no unsigned arm64 code at all). The
      # .app stays in Godot's zip, which keeps its executable bits.
      - name: Export macOS
        run: |
          mkdir -p export/macos
          godot --headless --export-release "macOS" export/macos/IsoDoom.zip
          unzip -l export/macos/IsoDoom.zip | grep -q " IsoDoom.app/Contents/MacOS/IsoDoom$"
          unzip -l export/macos/IsoDoom.zip | grep -q " IsoDoom.app/Contents/Resources/data_IsoDoom_macos_arm64/IsoDoom.dll$"
          unzip -l export/macos/IsoDoom.zip | grep -q " IsoDoom.app/Contents/Resources/data_IsoDoom_macos_x86_64/IsoDoom.dll$"
          ls -la export/macos

      - uses: actions/upload-artifact@v7
        with:
          name: IsoDoom-macos-universal
          path: export/macos/IsoDoom.zip
          if-no-files-found: error
          retention-days: 14

  # T8.4: the exported Windows build on Windows, headless (no GPU on the
  # runner): the smoke test, both checks and the route play, as the editor's
  # runs above. IsoDoom.console.exe runs IsoDoom.exe with its output on the
  # console (the game itself is a GUI program, whose output a pipe never sees).
  test-windows:
    name: Test Windows x86_64
    needs: export
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: IsoDoom-windows-x86_64
          path: export/windows

      - name: Generate the synthetic IWAD
        run: |
          iwad="$RUNNER_TEMP/isodoom-synthetic.wad"
          dotnet run --project tools/SyntheticIwad --configuration Debug -- "$iwad"
          echo "ISODOOM_CI_IWAD=$iwad" >> "$GITHUB_ENV"

      - name: Smoke-test the exported build
        timeout-minutes: 5
        run: |
          export/windows/IsoDoom.console.exe --headless --quit-after 60 2>&1 | tee smoke.log
          grep -q "IsoDoom started" smoke.log

      - name: Viewer check (exported build, headless)
        timeout-minutes: 10
        run: |
          export/windows/IsoDoom.console.exe --headless -- --viewer-check -iwad "$ISODOOM_CI_IWAD" 2>&1 | tee viewer-check.log
          grep -q "WAD viewer check: OK" viewer-check.log

      - name: Level check (exported build, headless)
        timeout-minutes: 10
        run: |
          export/windows/IsoDoom.console.exe --headless -- --level-check -iwad "$ISODOOM_CI_IWAD" 2>&1 | tee level-check.log
          grep -q "Level check: OK" level-check.log

      # An exported build runs in its own folder (Godot changes the working
      # directory to the exe's when the .pck is beside it), so the routes'
      # path is absolute (cygpath -m: D:/a/..., which .NET reads).
      - name: Route play (exported build, headless)
        timeout-minutes: 10
        run: |
          r="$(cygpath -m "$PWD")/tests/IsoDoom.Tests/Sim/Routes"
          export/windows/IsoDoom.console.exe --headless --fixed-fps 35 -- -iwad "$ISODOOM_CI_IWAD" --level E1M1 \
            --level-tweaks=vanilla --level-monsters=off \
            --level-script="route $r/synthetic-exit.route; gamestate intermission; skip; map E1M2 1; route $r/synthetic-secret-exit.route; map E1M2 2; skip; gamestate demoscreen"

  # T8.4a: the exported macOS build on macOS, headless, on both of its
  # architectures (macos-15 is Apple Silicon, macos-15-intel x86_64): the
  # smoke test, both checks and the route play, as test-windows. The
  # executable inside the .app prints to the console itself.
  test-macos:
    name: Test macOS (${{ matrix.arch }})
    needs: export
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      GAME: export/macos/IsoDoom.app/Contents/MacOS/IsoDoom
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/download-artifact@v8
        with:
          name: IsoDoom-macos-universal
          path: export/macos

      - name: Unpack the app
        run: |
          ditto -x -k export/macos/IsoDoom.zip export/macos
          test -x "$GAME"
          lipo -archs "$GAME"
          codesign --verify --deep --verbose=2 export/macos/IsoDoom.app

      - name: Generate the synthetic IWAD
        run: |
          iwad="$RUNNER_TEMP/isodoom-synthetic.wad"
          dotnet run --project tools/SyntheticIwad --configuration Debug -- "$iwad"
          echo "ISODOOM_CI_IWAD=$iwad" >> "$GITHUB_ENV"

      - name: Smoke-test the exported build
        timeout-minutes: 5
        run: |
          "$GAME" --headless --quit-after 60 2>&1 | tee smoke.log
          grep -q "IsoDoom started" smoke.log

      - name: Viewer check (exported build, headless)
        timeout-minutes: 10
        run: |
          "$GAME" --headless -- --viewer-check -iwad "$ISODOOM_CI_IWAD" 2>&1 | tee viewer-check.log
          grep -q "WAD viewer check: OK" viewer-check.log

      - name: Level check (exported build, headless)
        timeout-minutes: 10
        run: |
          "$GAME" --headless -- --level-check -iwad "$ISODOOM_CI_IWAD" 2>&1 | tee level-check.log
          grep -q "Level check: OK" level-check.log

      # Absolute routes' path, as on Windows (T8.4b).
      - name: Route play (exported build, headless)
        timeout-minutes: 10
        run: |
          r="$PWD/tests/IsoDoom.Tests/Sim/Routes"
          "$GAME" --headless --fixed-fps 35 -- -iwad "$ISODOOM_CI_IWAD" --level E1M1 \
            --level-tweaks=vanilla --level-monsters=off \
            --level-script="route $r/synthetic-exit.route; gamestate intermission; skip; map E1M2 1; route $r/synthetic-secret-exit.route; map E1M2 2; skip; gamestate demoscreen"

      # The checks' failure lines as annotations, readable on the run's page.
      - name: Annotate failures
        if: failure()
        run: |
          for f in *.log; do
            [ -f "$f" ] || continue
            grep -E "check: |ERROR|Unhandled|Exception" "$f" | grep -v ": OK$" | head -30 | sed "s/^/::error title=$f::/" || true
          done

  # A pushed tag v* (e.g. `git tag v0.1.0 && git push origin v0.1.0`)
  # publishes a GitHub release of that commit once every job above passed:
  # the three builds (stamped with the tag's version by the export job), zipped, with notes generated from the commits since the
  # previous tag. A tag with a hyphen (v0.2.0-rc1) makes a pre-release.
  release:
    name: Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [actionlint, export, test-windows, test-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package the builds
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          (cd artifacts/IsoDoom-linux-x86_64 && chmod +x IsoDoom.x86_64 && zip -r9 "$GITHUB_WORKSPACE/dist/IsoDoom-$TAG-linux-x86_64.zip" .)
          (cd artifacts/IsoDoom-windows-x86_64 && zip -r9 "$GITHUB_WORKSPACE/dist/IsoDoom-$TAG-windows-x86_64.zip" .)
          cp artifacts/IsoDoom-macos-universal/IsoDoom.zip "dist/IsoDoom-$TAG-macos-universal.zip"
          ls -la dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "IsoDoom $TAG" \
            --generate-notes --verify-tag "${flags[@]}"
